name: Verify Python planner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PDF dependency
        run: python -m pip install -r requirements.txt
      - name: Check calculations and local interface
        run: python -m unittest discover -v
      - name: Compare with the recovered original model
        run: python tests/verify_original.py
      - name: Check browser script syntax
        run: node --check planner.js
